name: Generate Profile Banner v2

on:
workflow_dispatch:

permissions:
contents: write

jobs:
generate-banner:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Prepare assets
    run: |
      mkdir -p generated
      echo "Preparing profile banner assets..."

  - name: Check portrait
    run: |
      if [ ! -f "assets/portrait.jpg" ]; then
        echo "Portrait not found."
        exit 1
      fi

      echo "Portrait found."

  - name: Generate banner
    run: |
      cp assets/banner-dark.svg generated/banner-dark.svg
      cp assets/banner-light.svg generated/banner-light.svg

      echo "Banner generation stage completed."

  - name: Commit generated banner
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add generated/

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Generate profile banner"
        git push
      fi
