name: Generate Banner SVGs

on:
  workflow_dispatch:
  push:
    paths:
      - 'portrait.jpg'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow

      - name: Run generator script
        run: |
          cat << 'EOF' > generate_banner.py
          import math
          import numpy as np
          from PIL import Image, ImageOps, ImageFilter

          def process_portrait(image_path="portrait.jpg"):
              try:
                  img = Image.open(image_path).convert("L")
              except FileNotFoundError:
                  img = Image.new("L", (300, 340), 128)
              img = ImageOps.fit(img, (300, 340), Image.Resampling.LANCZOS)
              img = ImageOps.autocontrast(img, cutoff=1)
              enhancer = Image.Image.point(img, lambda p: min(255, max(0, int((p - 128) * 1.3 + 128))))
              img = enhancer.filter(ImageFilter.UnsharpMask(radius=3, percent=140, threshold=3))
              arr = np.array(img, dtype=float) / 255.0
              h, w = arr.shape
              dithered = np.zeros((h, w), dtype=bool)
              for y in range(h):
                  row_range = range(w) if y % 2 == 0 else range(w - 1, -1, -1)
                  for x in row_range:
                      old_val = arr[y, x]
                      new_val = 1.0 if old_val > 0.5 else 0.0
                      dithered[y, x] = new_val
                      err = old_val - new_val
                      if y % 2 == 0:
                          if x + 1 < w: arr[y, x + 1] += err * 7 / 16
                          if y + 1 < h:
                              if x > 0: arr[y + 1, x - 1] += err * 3 / 16
                              arr[y + 1, x] += err * 5 / 16
                              if x + 1 < w: arr[y + 1, x + 1] += err * 1 / 16
                      else:
                          if x > 0: arr[y, x - 1] += err * 7 / 16
                          if y + 1 < h:
                              if x + 1 < w: arr[y + 1, x + 1] += err * 3 / 16
                              arr[y + 1, x] += err * 5 / 16
                              if x > 0: arr[y + 1, x - 1] += err * 1 / 16
              return dithered

          def generate_banner_svgs():
              WIDTH, HEIGHT = 1180, 610
              BG_COLOR = "#0A101F"
              UI_CHROME_DARK = "#22D3EE"
              UI_CHROME_LIGHT = "#0891B2"
              PORTRAIT_DARK = "#A78BFA"
              PORTRAIT_LIGHT = "#7C3AED"
              
              dithered_matrix = process_portrait()
              y_indices, x_indices = np.where(dithered_matrix)
              base_x, base_y = 90, 130
              path_chunks = []
              for i in range(0, len(x_indices), 15):
                  chunk_str = "".join([f"M {base_x + x_indices[j]} {base_y + y_indices[j]} h 1.5 v 1.5 h -1.5 z " for j in range(i, min(i + 15, len(x_indices)))])
                  path_chunks.append(chunk_str)
              portrait_path_data = "".join(path_chunks)

              info_rows = [
                  ("Subject", "Sandhya Madhusuthanan"), ("Role", "Student"),
                  ("Origin", "Coimbatore, Tamil Nadu"), ("Education", "Bachelors Degree"),
                  ("Status", "Active Developer & Learner"), ("ToolChain · Core.Lang", "Python, JavaScript, TypeScript"),
                  ("Core.Frontend", "React, HTML5, CSS3, Tailwind"), ("Core.Backend", "Node.js, Express, FastAPI"),
                  ("Core.Database", "PostgreSQL, MongoDB"), ("Core.Infra", "Git, GitHub Actions, Vercel"),
                  ("Grid.Mail", "sandhya@example.com"), ("Grid.Portfolio", "sandhyamadhusuthanan.dev"),
                  ("Grid.LinkedIn", "in/sandhyamadhusuthanan"), ("Grid.GitHub", "SandhyaMadhusuthanan"),
                  ("Grid.Facebook", "fb.com/sandhyamadhusuthanan")
              ]

              def build_svg(is_dark=True):
                  ui_color = UI_CHROME_DARK if is_dark else UI_CHROME_LIGHT
                  portrait_color = PORTRAIT_DARK if is_dark else PORTRAIT_LIGHT
                  bg = BG_COLOR if is_dark else "#F8FAFC"
                  panel_bg = "#0F172A" if is_dark else "#FFFFFF"
                  border_col = "#1E293B" if is_dark else "#E2E8F0"
                  text_col = "#94A3B8" if is_dark else "#64748B"
                  val_col = "#F8FAFC" if is_dark else "#0F172A"

                  svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {WIDTH} {HEIGHT}" width="{WIDTH}" height="{HEIGHT}">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
    text {{ font-family: 'Fira Code', monospace; }}
    .terminal-title {{ font-size: 13px; font-weight: 700; fill: {ui_color}; }}
    .info-label {{ font-size: 14px; fill: {text_col}; }}
    .info-val {{ font-size: 14px; font-weight: 500; fill: {val_col}; }}
    .live-text {{ font-size: 12px; font-weight: 700; fill: #EF4444; }}
    .pill-text {{ font-size: 14px; font-weight: 700; fill: {bg}; }}
  </style>
  <rect width="{WIDTH}" height="{HEIGHT}" rx="12" fill="{bg}" />
  <rect x="1" y="1" width="{WIDTH-2}" height="{HEIGHT-2}" rx="11" fill="none" stroke="{border_col}" stroke-width="2" />
  <path d="M 1 44 L {WIDTH-1} 44" stroke="{border_col}" stroke-width="1.5" />
  <circle cx="24" cy="22" r="6" fill="#EF4444" />
  <circle cx="44" cy="22" r="6" fill="#F59E0B" />
  <circle cx="64" cy="22" r="6" fill="#10B981" />
  <text x="90" y="26" class="terminal-title">profile.sh --live</text>
  <rect x="30" y="65" width="420" height="515" rx="8" fill="{panel_bg}" stroke="{border_col}" stroke-width="1" />
  <text x="50" y="95" class="terminal-title" letter-spacing="1.5">VISUAL.MAP</text>
  <rect x="50" y="115" width="380" height="445" rx="6" fill="{bg}" stroke="{border_col}" stroke-width="1" />
  <g fill="{portrait_color}" shape-rendering="crispEdges">
    <path d="{portrait_path_data}"><animate attributeName="opacity" values="0;1" dur="2s" fill="freeze" /></path>
  </g>
  <rect x="470" y="65" width="680" height="515" rx="8" fill="{panel_bg}" stroke="{border_col}" stroke-width="1" />
  <text x="500" y="95" class="terminal-title" letter-spacing="1.5">SYSTEM.INFO</text>
  <circle cx="1065" cy="91" r="5" fill="#EF4444"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" /></circle>
  <text x="1080" y="95" class="live-text">LIVE</text>
  <rect x="880" y="77" width="165" height="28" rx="14" fill="{ui_color}" />
  <text x="962" y="95" text-anchor="middle" class="pill-text">@SandhyaMadhusuthanan</text>'''
                  y_start, y_step = 140, 23
                  for i, (label, val) in enumerate(info_rows):
                      curr_y = y_start + (i * y_step)
                      svg += f'''  <g transform="translate(500, {curr_y})">
    <text x="0" y="0" class="info-label">{label}</text>
    <text x="210" y="-4" fill="{text_col}" font-size="12" xml:space="preserve">. . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
    <text x="440" y="0" class="info-val" textLength="200" lengthAdjust="spacingAndGlyphs">{val}</text>
  </g>\n'''
                  svg += "</svg>"
                  return svg

              with open("dark.svg", "w", encoding="utf-8") as f:
                  f.write(build_svg(is_dark=True))
              with open("light.svg", "w", encoding="utf-8") as f:
                  f.write(build_svg(is_dark=False))

          if __name__ == "__main__":
              generate_banner_svgs()
          EOF
          python generate_banner.py

      - name: Commit and push generated SVGs
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add dark.svg light.svg
          git diff-index --quiet HEAD || (git commit -m "Auto-generate banner SVGs" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
